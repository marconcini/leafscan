[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "leafscan"
version = "0.1.0"
description = "Plant disease detection from leaf images, with a RAG assistant for treatment advice."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.4",
    "torchvision>=0.19",
    "timm>=1.0",
    "huggingface_hub>=0.25",
    "pillow",
    "numpy",
    "scikit-learn",
    "matplotlib",
    "pyyaml",
]

[project.optional-dependencies]
app = ["gradio>=5"]
dev = ["pytest", "ruff"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
